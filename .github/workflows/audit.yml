name: audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: 自审 + 账本重放（py${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 纯标准库，无 requirements.txt —— 装依赖这步故意不加。
      - name: 账本重放自测
        run: python3 _selftest_verdict_replay.py

      # 带外 token 必须证明「零出站」：DNS/AWS/MCP 三面只在本地触发，
      # NoEgressGuard 拦住 connect/create_connection/getaddrinfo 并断言 0 次尝试。
      - name: 带外 token 自测（DNS / AWS / MCP，零出站）
        run: python3 _selftest_oob.py

      - name: 显式 allowlist + 噪声预算自测
        run: python3 _selftest_allowlist.py

      - name: 对抗性自审（期望 P0=0 P1=0 P2=0）
        run: python3 audit.py
